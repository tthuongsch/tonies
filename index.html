<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Tonie-Sammlung</title>
  <meta name="description" content="Übersicht meiner Tonies: was ich behalte und was ich verkaufe.">
  <!-- Nicht in Suchmaschinen aufnehmen; die Seite ist nur für Leute mit dem Link gedacht. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <div class="kopfzeile">
      <h1>Meine Tonie-Sammlung</h1>
      <div class="kopf-knoepfe">
        <button id="schloss" type="button" class="knopf leise schloss" aria-label="Mit PIN entsperren">🔒</button>
        <a class="knopf leise hinzufuegen" href="erfassen.html">+ Hinzufügen</a>
      </div>
    </div>

    <nav class="ansichten" aria-label="Ansicht">
      <button type="button" data-ansicht="alle">Alle</button>
      <button type="button" data-ansicht="behalten">Behalten</button>
      <button type="button" data-ansicht="verkaufen">Verkaufen</button>
      <button type="button" data-ansicht="verliehen">Verliehen</button>
    </nav>

    <div class="werkzeuge">
      <label class="suche">
        <span class="unsichtbar">Suche</span>
        <input id="suche" type="search" placeholder="Suche nach Titel, Reihe, Kollektion …" autocomplete="off">
      </label>
      <div class="filter">
        <label><span class="unsichtbar">Reihe</span><select data-filter="reihe"><option value="">Alle Reihen</option></select></label>
        <label><span class="unsichtbar">Format</span><select data-filter="format"><option value="">Alle Formate</option></select></label>
        <label><span class="unsichtbar">Inhalt</span><select data-filter="inhalt"><option value="">Alle Inhalte</option></select></label>
        <label><span class="unsichtbar">Thema</span><select data-filter="thema"><option value="">Alle Themen</option></select></label>
        <label><span class="unsichtbar">Zustand (Verkauf)</span><select data-filter="zustand"><option value="">Alle Zustände</option></select></label>
        <label><span class="unsichtbar">Rarität</span><select data-filter="raritaet"><option value="">Alle Raritäten</option></select></label>
      </div>
      <button id="zuruecksetzen" type="button" class="zuruecksetzen" hidden>Filter zurücksetzen</button>
    </div>

    <dl class="zaehler" aria-live="polite">
      <div><dt>Tonies</dt><dd id="z-tonies">–</dd></div>
      <div data-zaehler="behalten"><dt>zum Behalten</dt><dd id="z-behalten">–</dd></div>
      <div data-zaehler="verkaufen"><dt>zum Verkaufen</dt><dd id="z-verkaufen">–</dd></div>
      <div data-zaehler="verliehen"><dt>verliehen</dt><dd id="z-verliehen">–</dd></div>
    </dl>
  </header>

  <main>
    <p id="stand" class="stand" hidden></p>
    <p id="hinweis" class="hinweis">Lade Sammlung …</p>
    <ul id="karten" class="karten"></ul>
  </main>

  <!-- PIN-Fenster: schaltet Preise, Kommentare und Ausleihen frei -->
  <dialog id="pin-fenster" class="fenster" aria-labelledby="pin-titel">
    <form method="dialog">
      <div id="pin-zu">
        <h2 id="pin-titel">PIN eingeben</h2>
        <p class="klein">Zeigt Preise, Kommentare und an wen ein Tonie verliehen ist.</p>
        <input id="pin-eingabe" class="pin-eingabe" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4"
          autocomplete="off" aria-label="PIN, 4 Ziffern" placeholder="••••">
        <p id="pin-meldung" class="meldung" role="alert" hidden></p>
      </div>
      <div id="pin-offen" hidden>
        <h2>Entsperrt</h2>
        <p class="klein">Auf diesem Gerät bis <span id="pin-bis"></span>.</p>
        <button id="pin-sperren" type="button" class="knopf">Sperren</button>
      </div>
      <div class="knopfreihe"><button class="knopf leise" value="schliessen">Schließen</button></div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <script>
    // Testmodus nur lokal: echte Abläufe gegen nachgebautes Sheet, ohne Google.
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /testmodus/.test(location.search)) {
      document.write('<script src="tools/gs_attrappe.js"><\/script><script src="tools/erfassen_testmodus.js"><\/script>');
    }
  </script>
  <script src="data.js"></script>
  <script src="suche.js"></script>
  <script src="app.js"></script>
</body>
</html>
