<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Tonie-Sammlung</title>
  <meta name="description" content="Übersicht meiner Tonies: was ich behalte und was ich verkaufe.">
  <!-- Nicht in Suchmaschinen aufnehmen; die Seite ist nur für Leute mit dem Link gedacht. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Versionsnummer (?v=…) bei jeder neuen Fassung erhöhen: Dann lädt der Browser die Dateien neu
       statt eine alte Fassung aus dem Zwischenspeicher zu mischen. -->
  <link rel="stylesheet" href="style.css?v=23">
</head>
<body>
  <!-- Bleibt beim Scrollen oben: Titel, Schloss, Menü und Suche -->
  <div class="kopf-fest">
    <div class="kopf-innen">
      <div class="kopfzeile">
        <h1>Meine Tonie-Sammlung</h1>
        <div class="kopf-knoepfe">
          <button id="schloss" type="button" class="rund schloss" aria-label="Gesperrt – mit PIN entsperren"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button id="menue-knopf" type="button" class="rund" aria-label="Menü" aria-expanded="false" aria-controls="menue">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <nav id="menue" class="menue" aria-label="Menü" hidden>
            <a href="erfassen.html"><span class="sym" aria-hidden="true">＋</span>Tonie-Check</a>
            <a href="erfassen.html?pruefen"><span class="sym" aria-hidden="true">★</span>Sammlung prüfen</a>
            <button type="button" data-info="fototipps"><span class="sym" aria-hidden="true">📷</span>Foto-Tipps</button>
            <button type="button" data-info="hilfe"><span class="sym" aria-hidden="true">?</span>Hilfe</button>
            <span class="spaeter" aria-disabled="true"><span class="sym" aria-hidden="true"></span>Verkaufsseite (später)</span>
            <span class="spaeter" aria-disabled="true"><span class="sym" aria-hidden="true"></span>Statistik (später)</span>
          </nav>
        </div>
      </div>
      <label class="suche">
        <span class="unsichtbar">Suche</span>
        <input id="suche" type="search" placeholder="Suchen: Titel, Reihe, Thema …" autocomplete="off">
      </label>
    </div>
  </div>

  <header class="kopf">
    <div class="leiste">
      <nav class="ansichten" aria-label="Ansicht">
        <button type="button" data-ansicht="alle">Alle</button>
        <button type="button" data-ansicht="behalten">Behalten</button>
        <button type="button" data-ansicht="verkaufen">Verkaufen</button>
        <button type="button" data-ansicht="verliehen">Verliehen</button>
      </nav>
      <div class="leiste-knoepfe">
        <button id="filter-knopf" type="button" class="pille" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="filter-text">Filter</span>
        </button>
        <label class="pille sortierung">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="unsichtbar">Sortierung</span>
          <select id="sortierung"></select>
        </label>
      </div>
    </div>
    <div id="aktive-filter" class="aktive-filter" hidden></div>
    <p id="zaehler" class="zaehler" aria-live="polite">–</p>
  </header>

  <main>
    <p id="stand" class="stand" hidden></p>
    <p id="hinweis" class="hinweis">Lade Sammlung …</p>
    <ul id="karten" class="karten"></ul>
  </main>

  <!-- PIN-Fenster: schaltet Preise, Kommentare und Ausleihen frei -->
  <dialog id="pin-fenster" class="fenster" aria-labelledby="pin-titel">
    <form method="dialog">
      <div id="pin-zu">
        <h2 id="pin-titel">PIN eingeben</h2>
        <p class="klein">Zeigt Preise, Kommentare und an wen ein Tonie verliehen ist.</p>
        <input id="pin-eingabe" class="pin-eingabe" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4"
          autocomplete="off" aria-label="PIN, 4 Ziffern" placeholder="••••">
        <p id="pin-meldung" class="meldung" role="alert" hidden></p>
      </div>
      <div id="pin-offen" hidden>
        <h2>Entsperrt</h2>
        <p class="klein">Auf diesem Gerät bis <span id="pin-bis"></span>.</p>
        <button id="pin-sperren" type="button" class="knopf">Sperren</button>
      </div>
      <div class="knopfreihe"><button class="knopf leise" value="schliessen">Schließen</button></div>
    </form>
  </dialog>

  <!-- Kurze Bestätigung nach dem Speichern -->
  <p id="toast" class="toast" role="status" hidden></p>

  <!-- Filterfenster: am Handy von unten, am Computer in der Mitte -->
  <dialog id="filter-fenster" class="fenster blatt" aria-labelledby="filter-titel">
    <div class="blatt-kopf">
      <h2 id="filter-titel">Filter</h2>
      <button type="button" class="rund" data-schliessen aria-label="Schließen">✕</button>
    </div>
    <div class="filter">
      <!-- Format und Inhalt: mehrere Werte gleichzeitig (z. B. alle Figuren ohne Audioinhalte); nebeneinander, darunter die Auswahllisten -->
      <fieldset class="filter-haken" data-filter-mehr="format"><legend>Format</legend><div class="haken-gitter"></div></fieldset>
      <fieldset class="filter-haken" data-filter-mehr="inhalt"><legend>Inhalt</legend><div class="haken-gitter"></div></fieldset>
      <label>Reihe<select data-filter="reihe"><option value="">alle</option></select></label>
      <label>Thema<select data-filter="thema"><option value="">alle</option></select></label>
      <label>Zustand (Verkauf)<select data-filter="zustand"><option value="">alle</option></select></label>
      <label>Rarität<select data-filter="raritaet"><option value="">alle</option></select></label>
      <label>Version<select data-filter="version"><option value="">alle</option></select></label>
      <!-- Nur entsperrt: "geprüft" hängt am privaten Wert-Stand -->
      <label data-nur-entsperrt>Wert geprüft<select data-filter="geprueft"><option value="">alle</option></select></label>
      <label data-nur-entsperrt>Preis<select data-filter="preis"><option value="">alle</option></select></label>
    </div>
    <div class="knopfreihe">
      <button id="filter-zuruecksetzen" type="button" class="knopf leise">Zurücksetzen</button>
      <button id="filter-anzeigen" type="button" class="knopf" data-schliessen>Ergebnisse anzeigen</button>
    </div>
  </dialog>

  <!-- Foto-Tipps und Hilfe aus dem Menü -->
  <dialog id="info-fenster" class="fenster" aria-labelledby="info-titel">
    <div class="blatt-kopf">
      <h2 id="info-titel"></h2>
      <button type="button" class="rund" data-schliessen aria-label="Schließen">✕</button>
    </div>
    <div id="info-text" class="info-text"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js?v=23"></script>
  <script>
    // Testmodus nur lokal: echte Abläufe gegen nachgebautes Sheet, ohne Google.
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /testmodus/.test(location.search)) {
      document.write('<script src="tools/gs_attrappe.js"><\/script><script src="tools/erfassen_testmodus.js"><\/script>');
    }
  </script>
  <script src="data.js?v=23"></script>
  <script src="suche.js?v=23"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
